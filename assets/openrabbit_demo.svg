<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Backdrop canvas with dots -->
  <rect width="500" height="500" fill="#fdfcf8" />
  
  <g transform="translate(45, 60)">
    <!-- Main Terminal Card Frame with Shadow -->
    <rect x="16" y="16" width="390" height="340" fill="#000000" rx="12"/>
    <rect x="0" y="0" width="390" height="340" fill="#ffffff" stroke="#000000" stroke-width="5" rx="12"/>
    
    <!-- Title Bar - updated to brand Red -->
    <rect x="0" y="0" width="390" height="42" fill="#ef4444" stroke="#000000" stroke-width="5" rx="12"/>
    <line x1="0" y1="42" x2="390" y2="42" stroke="#000000" stroke-width="5" />
    
    <!-- Control Buttons -->
    <circle cx="22" cy="21" r="8" fill="#ef4444" stroke="#000000" stroke-width="2.5" />
    <circle cx="44" cy="21" r="8" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
    <circle cx="66" cy="21" r="8" fill="#10b981" stroke="#000000" stroke-width="2.5" />
    
    <text x="210" y="27" font-family="'Azeret Mono', monospace" font-size="12" font-weight="extrabold" fill="#ffffff" text-anchor="middle">⚡ OPENRABBIT ACTION LOGS</text>
    
    <!-- Code line layout -->
    <g transform="translate(25, 65)">
      <!-- Normal diff headers -->
      <text x="0" y="15" font-family="'Azeret Mono', monospace" font-size="13" font-weight="bold" fill="#71717a">@@ -15,9 +15,11 @@ exports.handler</text>
      
      <!-- Inside diff lines -->
      <rect x="-8" y="30" width="355" height="30" fill="#fee2e2" opacity="0.8" rx="4"/>
      <text x="5" y="50" font-family="'Azeret Mono', monospace" font-size="12" font-weight="semibold" fill="#ef4444">- const isAuthorized = checkCookiesServer(req);</text>
      
      <rect x="-8" y="65" width="355" height="48" fill="#d1fae5" opacity="0.8" rx="4"/>
      <text x="5" y="85" font-family="'Azeret Mono', monospace" font-size="12" font-weight="semibold" fill="#10b981">+ const authHeader = req.headers.authorization;</text>
      <text x="5" y="103" font-family="'Azeret Mono', monospace" font-size="12" font-weight="semibold" fill="#10b981">+ const isAuthorized = verifyJwtToken(authHeader);</text>
      
      <!-- OpenRabbit inline Review Card - styled in brand Red -->
      <g transform="translate(15, 130)">
        <!-- Shadow -->
        <rect x="8" y="8" width="310" height="110" fill="#000000" rx="8"/>
        <!-- Card body -->
        <rect x="0" y="0" width="310" height="110" fill="#faf9f5" stroke="#ef4444" stroke-width="3" rx="8"/>
        <!-- Label Badge -->
        <rect x="-2" y="-12" width="135" height="24" fill="#ef4444" stroke="#000000" stroke-width="2" rx="4"/>
        <text x="12" y="4" font-family="'Azeret Mono', monospace" font-size="10" font-weight="extrabold" fill="#ffffff">🐰 OPENRABBIT REVIEW</text>
        
        <!-- Review contents -->
        <text x="15" y="34" font-family="'Source Sans 3', sans-serif" font-weight="700" font-size="12" fill="#111827">Security Suggestion:</text>
        <text x="15" y="52" font-family="'Source Sans 3', sans-serif" font-weight="500" font-size="11.5" fill="#374151">Verification using JWT is far more secure than cookies for API endpoints.</text>
        
        <!-- Button Suggestion Apply badge -->
        <g transform="translate(15, 68)">
          <rect x="0" y="4" width="115" height="25" fill="#10b981" stroke="#000000" stroke-width="2" rx="4" />
          <text x="18" y="20" font-family="'Azeret Mono', monospace" font-size="9" font-weight="bold" fill="#ffffff">✓ Apply Review</text>
          
          <rect x="130" y="4" width="135" height="25" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" rx="4" />
          <text x="145" y="19" font-family="'Azeret Mono', monospace" font-size="9" fill="#888888">Dismiss Suggestion</text>
        </g>
      </g>
    </g>
  </g>
</svg>
