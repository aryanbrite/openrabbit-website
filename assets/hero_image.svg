<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definition for grid background patterns -->
  <defs>
    <pattern id="brutalist-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#000000" stroke-width="0.75" stroke-opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Solid Canvas Background with a subtle warm tint -->
  <rect width="500" height="500" fill="#fdfcf8" />
  <rect width="500" height="500" fill="url(#brutalist-grid)" />

  <!-- Background Decorative Shapes (Neo-Brutalist floating elements) -->
  <rect x="360" y="60" width="100" height="100" fill="#ef4444" stroke="#000000" stroke-width="4" rx="8" transform="rotate(8 410 110)"/>
  <circle cx="80" cy="120" r="45" fill="#ef4444" stroke="#000000" stroke-width="4" />
  <polygon points="120,400 160,460 80,450" fill="#f59e0b" stroke="#000000" stroke-width="4" transform="rotate(-15 120 430)" />

  <!-- Code Window / PR Board Wrapper with Solid Shadow -->
  <g transform="translate(60, 110)">
    <!-- Shadow -->
    <rect x="15" y="15" width="370" height="270" fill="#000000" rx="10"/>
    <!-- Window Body -->
    <rect class="window-body" x="0" y="0" width="370" height="270" fill="#ffffff" stroke="#000000" stroke-width="4" rx="10"/>
    
    <!-- Window Header / Title Bar - now in elegant signature brand red -->
    <rect x="0" y="0" width="370" height="40" fill="#ef4444" stroke="#000000" stroke-width="4" rx="10"/>
    <line x1="0" y1="40" x2="370" y2="40" stroke="#000000" stroke-width="4" />
    
    <!-- Window Controls -->
    <circle cx="20" cy="20" r="7" fill="#ef4444" stroke="#000000" stroke-width="2.5" />
    <circle cx="40" cy="20" r="7" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
    <circle cx="60" cy="20" r="7" fill="#10b981" stroke="#000000" stroke-width="2.5" />
    
    <!-- Header Title -->
    <text x="185" y="26" font-family="'Azeret Mono', monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">PULL REQUEST #42 - OPENRABBIT</text>
    
    <!-- Content / Simulated Code Editor -->
    <!-- Red diff block -->
    <rect x="15" y="60" width="340" height="35" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" rx="4"/>
    <text x="25" y="82" font-family="'Azeret Mono', monospace" font-size="11" fill="#dc2626">—   const review = await manualCheck(code);</text>
    
    <!-- Green diff block -->
    <rect x="15" y="105" width="340" height="35" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" rx="4"/>
    <text x="25" y="127" font-family="'Azeret Mono', monospace" font-size="11" fill="#059669">+   const review = await OpenRabbit.review(diff);</text>
    
    <!-- Normal Code -->
    <text x="25" y="170" font-family="'Azeret Mono', monospace" font-size="11" fill="#3f3f46">    console.log("Shipped to Production! 🚀");</text>
    
    <!-- Automated Review Toast (Speech bubble popping out) -->
    <g transform="translate(60, 185)">
      <!-- Bubble Shadow -->
      <path d="M 5,5 L 245,5 L 245,55 L 45,55 L 25,75 L 25,55 L 5,55 Z" fill="#000000"/>
      <!-- Bubble Body -->
      <path d="M 0,0 L 240,0 L 240,50 L 40,50 L 20,70 L 20,50 L 0,50 Z" fill="#fcfbf7" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>
      
      <!-- Reviewer Avatar inside bubble (Official brand circle rabbit silhouette) -->
      <circle cx="28" cy="25" r="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <g transform="translate(14.5, 11.5) scale(0.27)">
        <path d="M 64.9,74.5 C 64.9,76.5 63.8,78.0 59.8,78.0 C 55.8,78.0 55.3,73.5 53.3,71.0 C 51.3,68.5 49.3,74.5 47.8,78.0 C 46.3,81.5 28.3,81.5 26.3,78.0 C 24.3,74.5 23.3,61.0 27.8,55.0 C 32.3,49.0 42.3,48.0 46.8,50.0 C 51.3,52.0 56.4,49.5 56.4,45.0 C 56.4,40.5 51.3,27.0 45.8,18.0 C 43.8,14.7 46.2,14.7 48.2,17.0 C 57.2,27.0 61.3,37.0 61.3,43.0 C 61.3,40.5 56.4,26.0 54.4,15.0 C 53.4,9.5 55.4,9.5 58.4,12.5 C 66.4,20.5 70.4,32.5 69.4,39.5 C 69.4,39.5 76.4,35.5 80.4,42.5 C 83.4,47.7 82.4,52.5 78.4,55.5 C 74.4,58.5 68.4,57.5 65.4,61.5 C 62.4,65.5 64.9,71.5 64.9,74.5 Z" fill="#ef4444" />
      </g>
      
      <!-- Comment Text -->
      <text x="52" y="21" font-family="'Azeret Mono', monospace" font-weight="bold" font-size="9.5" fill="#000000">OpenRabbit (AI Copilot):</text>
      <text x="52" y="36" font-family="'Source Sans 3', sans-serif" font-weight="600" font-size="10.5" fill="#059669">✓ LGTM! Safe to merge (0 bugs found).</text>
    </g>
  </g>

  <!-- Big Decorative Rabbit Ears Peeking from Bottom Right to overlap design -->
  <g transform="translate(360, 310)">
    <!-- Shadow -->
    <path d="M 10 90 Q 5 -40 50 -10 Q 75 -20 110 90 Z" fill="#000000" opacity="0.1"/>
    <!-- Left Ear -->
    <path d="M 12,85 C 2,-15 42,-15 42,85" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
    <path d="M 22,80 C 12,15 32,15 32,80" fill="#ef4444" />
    
    <!-- Right Ear -->
    <path d="M 38,85 C 48,-25 88,-5 72,85" fill="#ffffff" stroke="#000000" stroke-width="4.5"/>
    <path d="M 48,80 C 58,15 78,35 62,80" fill="#ef4444" />
  </g>
</svg>
