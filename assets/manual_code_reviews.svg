<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Cool warm backdrop grid -->
  <rect width="500" height="500" fill="#fdfcf8" />
  
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="#000000" stroke-width="4" stroke-dasharray="8,8" opacity="0.4"/>

  <!-- Piles of Unreviewed PRs (Overlapping sheets of papers with bug icons) -->
  <g transform="translate(110, 140)">
    <!-- Pile Shadow -->
    <rect x="25" y="25" width="260" height="240" fill="#000000" rx="8" />
    
    <!-- Third paper (bottom) -->
    <rect x="-15" y="-15" width="260" height="240" fill="#fff" stroke="#000000" stroke-width="4" rx="8" transform="rotate(-6 115 105)"/>
    
    <!-- Second paper (middle) -->
    <rect x="10" y="10" width="260" height="240" fill="#ffffff" stroke="#000000" stroke-width="4" rx="8" transform="rotate(3 140 130)"/>
    <line x1="40" y1="50" x2="220" y2="50" stroke="#0a0a0a" stroke-width="4" />
    <line x1="40" y1="80" x2="180" y2="80" stroke="#0a0a0a" stroke-width="4" />
    
    <!-- First paper (top, active, full of review errors) -->
    <rect x="0" y="0" width="260" height="240" fill="#ffffff" stroke="#000000" stroke-width="4" rx="8" />
    
    <!-- Title: PR Review Sheet -->
    <text x="30" y="40" font-family="'Azeret Mono', monospace" font-size="16" font-weight="bold" fill="#ef4444">CRITICAL REJECT</text>
    <line x1="30" y1="52" x2="230" y2="52" stroke="#ef4444" stroke-width="3" />
    
    <!-- Simulated broken lines of code with red highlights -->
    <!-- Red dot -->
    <circle cx="45" cy="85" r="7" fill="#ef4444" stroke="#000000" stroke-width="2"/>
    <line x1="65" y1="85" x2="210" y2="85" stroke="#ef4444" stroke-width="4" />
    
    <circle cx="45" cy="115" r="7" fill="#ef4444" stroke="#000000" stroke-width="2"/>
    <line x1="65" y1="115" x2="190" y2="115" stroke="#ef4444" stroke-width="4" />
    <line x1="65" y1="135" x2="150" y2="135" stroke="#a1a1aa" stroke-width="3" />
    
    <circle cx="45" cy="175" r="7" fill="#ef4444" stroke="#000000" stroke-width="2"/>
    <line x1="65" y1="175" x2="220" y2="175" stroke="#ef4444" stroke-width="4" />
    
    <!-- Bug Graphics directly nested -->
    <g transform="translate(190, 110) rotate(15)">
      <ellipse cx="20" cy="20" rx="12" ry="16" fill="#ef4444" stroke="#000000" stroke-width="3.5" />
      <line x1="20" y1="4" x2="20" y2="36" stroke="#000000" stroke-width="3.5" />
      <line x1="5" y1="12" x2="35" y2="12" stroke="#000000" stroke-width="3" />
      <line x1="2" y1="20" x2="38" y2="20" stroke="#000000" stroke-width="3" />
      <line x1="5" y1="28" x2="35" y2="28" stroke="#000000" stroke-width="3" />
      <!-- Antennae -->
      <path d="M 12 4 Q 8 -10 2 -12" stroke="#000000" stroke-width="3" fill="none"/>
      <path d="M 28 4 Q 32 -10 38 -12" stroke="#000000" stroke-width="3" fill="none"/>
    </g>
  </g>

  <!-- Big Red Alarm Icon (brutalist badge in top right) -->
  <g transform="translate(330, 80) rotate(-10)">
    <rect x="5" y="5" width="90" height="90" fill="#000000" rx="8"/>
    <rect x="0" y="0" width="90" height="90" fill="#ef4444" stroke="#000000" stroke-width="4" rx="8"/>
    <text x="45" y="45" font-family="'Azeret Mono', monospace" font-size="34" font-weight="extrabold" fill="#ffffff" text-anchor="middle">⚠️</text>
    <text x="45" y="75" font-family="'Azeret Mono', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">BUG FOUND</text>
  </g>

  <!-- Sad coffee cup in bottom left - now in brand Red -->
  <g transform="translate(60, 350) rotate(12)">
    <rect x="4" y="4" width="70" height="75" fill="#000000" rx="6" />
    <rect x="0" y="0" width="70" height="75" fill="#ef4444" stroke="#000000" stroke-width="4" rx="6" />
    <!-- Handle -->
    <path d="M 70 20 Q 88 20 88 38 Q 88 55 70 55" stroke="#000000" stroke-width="4.5" fill="none" />
    <!-- Sad face on cup -->
    <ellipse cx="25" cy="30" rx="3" ry="5" fill="#000000" />
    <ellipse cx="45" cy="30" rx="3" ry="5" fill="#000000" />
    <path d="M 28 55 Q 35 45 42 55" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 20 -15 Q 15 -30 25 -40" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 45 -12 Q 50 -25 40 -35" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
